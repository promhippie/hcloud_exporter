---
# yaml-language-server: $schema=https://www.schemastore.org/hugo.json
baseURL: https://promhippie.github.io/hcloud_exporter/
locale: en-us
title: Hetzner Cloud Exporter
pygmentsUseClasses: true
enableRobotsTXT: true

disableKinds:
  - rss
  - sitemap
  - taxonomy
  - term
  - section

cascade:
  - build:
      render: never
      list: always
    target:
      kind: page

blackfriday:
  angledQuotes: true
  fractions: false
  plainIDAnchors: true
  smartlists: true
  extensions:
    - hardLineBreak

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  author: Thomas Boerger
  description: Prometheus exporter for Hetzner Cloud
  keywords: prometheus, exporter, hetzner, cloud

...
